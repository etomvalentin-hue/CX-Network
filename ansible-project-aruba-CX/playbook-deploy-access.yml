---
- name: Deploy Access Switch Configuration
  hosts: access
  gather_facts: false
  collections:
    - arubanetworks.aos_switch

    #- "{{ playbook_dir }}/inventory/production/group_vars/vault.yml"
    
  vars_files:
    - inventory/production/group_vars/vault.yml
    
  vars: 
    ansible_user: {{ "vault_ansible_user" }}
    ansible_password: {{ "vault_ansible_password" }}
    
  roles:
    - access_switch