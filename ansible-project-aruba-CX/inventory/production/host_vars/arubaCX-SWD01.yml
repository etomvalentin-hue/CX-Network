---
# Configuration de base
hostname: arubaCX-SWD01
role: distribution
vsx_role: "primary"
ansible_host: 192.168.1.10 


# Configuration VSX
vsx:
  system_mac: "00:01:02:03:04:05"
  isl:
    interface: "1/1/4-1/1/5"
    description: "VSX_ISL"
  keepalive:
    interface: "1/1/6"
    ip: "192.168.255.1"
    peer_ip: "192.168.255.2"


# PortChannel vers Routeur WAN (BGP)
portchannels:
  - id: 100
    description: "PORTCHANNEL_TO_WAN_ROUTER"
    type: "routed"
    ip_address: "10.10.0.1/30"  # IP virtuelle VSX
    protocol: "lacp"
    mode: "active"
    members:
      - interface: "1/1/1"
        description: "PO100_MEMBER_TO_WAN"

# PortChannels vers switches d'accès (OSPF)
portchannels:
  - id: 10
    description: "PORTCHANNEL_TO_ACCESS_SW_01"
    type: "switched"
    protocol: "lacp"
    mode: "active"
    members:
      - interface: "1/1/3"
        description: "PO200_MEMBER_TO_ACC_01"
    vlans:
      allowed: "10,100,200"
      native: 1

  - id: 20
    description: "PORTCHANNEL_TO_ACCESS_SW_02"
    type: "switched"
    protocol: "lacp"
    mode: "active"
    members:
      - interface: "1/1/4"
        description: "PO201_MEMBER_TO_ACC_02"
    vlans:
      allowed: "10,100,200"
      native: 1


# VLANs (OSPF)
vlans:
  - id: 10
    name: "MGMT"
    ip_address: "192.168.10.10/24"
    opsf_area: "0.0.0.0"
  - id: 100
    name: "USER"
    ip_address: "10.10.100.1/24"
    opsf_area: "0.0.0.0"
  - id: 200
    name: "SERVER"
    ip_address: "10.10.200.1/24"
    opsf_area: "0.0.0.0"

# Configuration BGP vers WAN
bgp:
  as_number: 65000
  router_id: "192.168.10.10"  # Router ID virtuel VSX
  networks:
    - "10.10.0.0/30"
  neighbors:
    - ip: "192.168.10.2"
      remote_as: 65001
      description: "WAN_ROUTER"
# Configuration OSPF pour LAN
ospf:
  process_id: 1
  router_id: "192.168.10.10"
  passive_interfaces:
    - "vlan10"
    - "vlan100"
    - "vlan200"
  networks:
    - "192.168.10.0/24"
    - "10.10.100.0/24"
    - "10.10.200.0/30"
  redistribute:
    - bgp
    - connected
