---
hostname: "arubaCX-Rt1"
ansible_host: "192.168.116.136"
role: wan

vlans:
  - id: 10
    name: "MGMT"
    ip_address: "192.168.10.1/24"



# Port LAGvers VSX Distribution (BGP)
lags:
  - id: 100
    description: "LAG_TO_VSX_CLUSTER_BGP"
    type: "routed"
    ip_address: "10.10.0.2/30"
    protocol: "lacp"
    mode: "active"
    members:
      - interface: "1/1/1"
        description: "PO100_MEMBER_TO_CORE_01"
      - interface: "1/1/2"
        description: "PO100_MEMBER_TO_CORE_02"

# Interfaces WAN
wan_interfaces:
  - interface: "1/1/3"
    description: "LINK_TO_ISP_A"
    type: "routed"
    ip_address: "203.0.113.10/30"
  - interface: "1/1/4"
    description: "LINK_TO_ISP_B"
    type: "routed"
    ip_address: "198.51.100.10/30"

# Configuration BGP
bgp:
  as_number: 65001
  router_id: "192.168.10.1"
  networks:
    - "192.168.1.0/24"
    - "192.168.10.0/30"
    - "10.10.0.0/30"
  neighbors:
    - ip: "10.10.0.1"
      remote_as: 65000
      description: "VSX_CLUSTER"
      next_hop_self: false
    - ip: "203.0.113.9"
      remote_as: 64500
      description: "ISP_A"
      next_hop_self: true
      route_map_out: "TO_ISP"
    - ip: "198.51.100.9"
      remote_as: 64501
      description: "ISP_B"
      next_hop_self: true
      route_map_out: "TO_ISP"

# Prefix-lists (définies dans host_vars)
prefix_lists:
  - name: "LOCAL_NETWORKS"
    sequences:
      - sequence: 10
        action: "permit"
        network: "192.168.1.0/24"
      - sequence: 20
        action: "permit"
        network: "192.168.10.0/24"
      - sequence: 30
        action: "permit"
        network: "10.10.0.0/30"
  - name: "PRIVATE_NETWORKS"
    sequences:
      - sequence: 10
        action: "deny"
        network: "10.0.0.0/8"
      - sequence: 20
        action: "deny"
        network: "172.16.0.0/12"
      - sequence: 30
        action: "deny"
        network: "192.168.0.0/16"
      - sequence: 40
        action: "permit"
        network: "0.0.0.0/0 le 32"

# ACLs (définies dans host_vars)
acls:
  - name: "MGMT_ACCESS"
    type: "ip"
    sequences:
      - sequence: 10
        action: "permit"
        source: "192.168.1.0/24"
        destination: "any"
      - sequence: 20
        action: "deny"
        source: "any"
        destination: "any"
  - name: "BGP_PEERS"
    type: "ip"
    sequences:
      - sequence: 10
        action: "permit"
        source: "203.0.113.9/32"
        destination: "any"
      - sequence: 20
        action: "permit"
        source: "198.51.100.9/32"
        destination: "any"