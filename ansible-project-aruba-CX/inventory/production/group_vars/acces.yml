---
# Acces.yaml
# Paramètres communs
role: "access"
mgmt_vlan: 10

#mgmt_ip: "{{ ansible_host }}"  # Utilise l'IP de connexion
mgmt_subnet: "255.255.255.0"
gateway: "192.168.1.1"


# Standards de sécurité pour ports d'accès
port_security:
  bpdu_guard: true
  portfast: true
  storm_control: true

# Configuration NAC/802.1X (si applicable)
nac:
  enabled: true
  default_profile: "DEFAULT_USER"

# Configuration spanning-tree
spanning_tree:
  mode: "rstp"
  priority: 32768

# Configuration NAC/802.1X
nac:
  enabled: true
  authentication_protocol: "dot1x"  # dot1x, mac-auth, ou both
  default_role: "authenticated"
  guest_role: "guest"
  voice_role: "voice"
  server_groups:
    - name: "RADIUS_SERVERS"
      servers:
        - host: "1.1.1.1"
          key: "{{ radius_key }}"
        - host: "1.1.1.2" 
          key: "{{ radius_key }}"
  authentication_profiles:
    - name: "DEFAULT_DOT1X"
      protocol: "dot1x"
      server_group: "RADIUS_SERVERS"
    - name: "DEFAULT_MAC_AUTH"
      protocol: "mac-auth"
      server_group: "RADIUS_SERVERS"